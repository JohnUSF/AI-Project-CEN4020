[pytest]
addopts = -ra
pythonpath = .
testpaths = tests
markers =
    req(*ids): requirement IDs from features/*/requirements.md that this test protects (mandatory)
    blackbox: edge case derived from the specification only
    whitebox: edge case derived from reading the source
    call5: protects behaviour decided or changed after Call 5
    perf: load/latency measurement (needs the live server)
    call6: maintains behavior added or changed after Call 6
    part7: protects the configurable English/Spanish interface added in Part 7
    part8: guards Flask-Babel integration, pinned catalogs, and Call 7 behavior
    localization-001: Part 8 localization requirement 001
    localization-002: Part 8 localization requirement 002
    localization-003: Part 8 localization requirement 003
    localization-004: Part 8 localization requirement 004
    localization-005: Part 8 localization requirement 005
    localization-006: Part 8 localization requirement 006
    localization-007: Part 8 localization requirement 007
    localization-008: Part 8 localization requirement 008
