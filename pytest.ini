[pytest]
addopts = -ra
pythonpath = .
testpaths = tests
markers =
    req(*ids): requirement IDs from features/*/requirements.md that this test protects (mandatory)
    blackbox: edge case derived from the specification only
    whitebox: edge case derived from reading the source
    call5: protects behaviour decided or changed after Call 5
    perf: load/latency measurement (needs the live server)
