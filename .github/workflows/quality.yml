name: EventHub quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements-dev.txt
      - name: Python compilation
        run: python -m compileall -q eventhub tests scripts
      - name: Ruff lint
        run: ruff check eventhub tests scripts --select E4,E7,E9,F63,F7,F82
      - name: Ruff formatting (no auto-correction in CI)
        run: ruff format --check eventhub tests scripts
      - name: Pytest - all modules, no skips
        run: python -m pytest -q --strict-markers
      - name: Part 3 / Part 4 EARS and C4 structure
        run: python grading/check_part3.py .
