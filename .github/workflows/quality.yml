name: EventHub quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements-dev.txt
      - name: Python compilation
        run: python -m compileall -q eventhub tests tests_system scripts
      - name: Ruff lint
        run: ruff check eventhub tests tests_system scripts --select E4,E7,E9,F63,F7,F82
      - name: Ruff formatting (no auto-correction in CI)
        run: ruff format --check eventhub tests tests_system scripts
      - name: Pytest - unit and integration, no skips
        run: python -m pytest -q --strict-markers
      - name: Part 3 / Part 4 / Part 5 EARS and C4 structure
        run: python grading/check_part3.py .
      - name: Every active requirement has a test (or a written reason)
        run: python grading/check_test_traceability.py .

  # Part 5: the Selenium system tests, against the real app, in headless Chrome.
  system-tests:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements-dev.txt -r requirements-system.txt
      - name: Selenium system tests and load measurement
        run: python -m pytest tests_system -q --strict-markers -rfE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test-evidence
          path: report/system_run
