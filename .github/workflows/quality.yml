name: EventHub quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q eventhub tests scripts
      - run: ruff check eventhub tests scripts --select E4,E7,E9,F63,F7,F82
      - run: python -m pytest -q
      - run: python grading/check_part3.py .
