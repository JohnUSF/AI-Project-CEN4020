# Re-created for Part 5. The Part 4 workflow file was not part of the files supplied, so this
# follows the Part 4 README's description (compile, Ruff lint + format, pytest, Part 3 gate)
# and adds the Part 5 jobs: requirement traceability and the Selenium system suite.
# NOT executed from the Part 5 sandbox. Run it on GitHub and read the result before relying on it.
name: EventHub quality
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q eventhub tests tests_system scripts
      - run: ruff check eventhub tests tests_system scripts --select E4,E7,E9,F63,F7,F82
      - run: ruff format --check eventhub tests tests_system scripts
      - run: python -m pytest -q
      - run: python grading/check_part3.py .
      - run: python grading/check_test_traceability.py .

  system-tests:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt -r requirements-system.txt
      - run: python -m pytest tests_system -q -rfE      # Chrome and chromedriver come with ubuntu-latest
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: system-test-evidence, path: report/system_run}
