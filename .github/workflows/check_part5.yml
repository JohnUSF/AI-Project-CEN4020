# Part 8 explicitly requires this named Part 5 eligibility workflow on default branch.
# Retain quality.yml; this is an independent named gate for course verification.
name: check_part5
on: [push, pull_request]
jobs:
  eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-system.txt
      - run: python -m compileall -q eventhub tests tests_system scripts
      - run: python -m ruff check eventhub tests tests_system scripts --select E4,E7,E9,F63,F7,F82
      - run: python -m ruff format --check eventhub tests tests_system scripts
      - run: python grading/check_part3.py .
      - run: python grading/check_test_traceability.py .
      - run: python -m pytest tests -q
      - run: python -m pytest tests_system -q -rfE
