{% extends 'base.html' %}{% block title %}Sign in{% endblock %}
{% block content %}<div class="auth-wrap"><div class="eyebrow">{{ t("auth.login_eyebrow") }}</div><h1>{{ t("auth.login_title") }}</h1><p>{{ t("auth.login_intro") }}</p><form class="panel form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next_page }}"><label for="email">{{ t("auth.email") }}</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">{{ t("auth.password") }}</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary" type="submit">{{ t("auth.login") }}</button></form><p class="tiny muted">{{ t("auth.noaccount") if lang == "es" else "Don't have an account?" }} <a href="{{ url_for('register') }}">{{ t("auth.create_one") }}</a></p></div>{% endblock %}
