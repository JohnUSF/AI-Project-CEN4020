{% extends 'base.html' %}{% block title %}Sign in{% endblock %}
{% block content %}<div class="auth-wrap"><div class="eyebrow">YOUR EVENTS, YOUR WAY</div><h1>Welcome back.</h1><p>Sign in to check out and manage your tickets.</p><form class="panel form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next_page }}"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary" type="submit">Sign in ↗</button></form><p class="tiny muted">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p></div>{% endblock %}
