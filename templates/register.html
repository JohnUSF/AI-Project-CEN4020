{% extends 'base.html' %}{% block title %}Join EventHub{% endblock %}
{% block content %}<div class="auth-wrap"><div class="eyebrow">GET IN ON THE ACTION</div><h1>Join EventHub.</h1><p>Discover the best events on campus.</p><form class="panel form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="name">Name</label><input id="name" name="name" maxlength="100" autocomplete="name" required><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password (at least 10 characters)</label><input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required><button class="btn btn-primary" type="submit">Create account ↗</button></form></div>{% endblock %}
