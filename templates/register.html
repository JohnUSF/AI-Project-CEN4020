{% extends 'base.html' %}{% block title %}Join EventHub{% endblock %}
{% block content %}<div class="auth-wrap"><div class="eyebrow">{{ t("auth.register_eyebrow") }}</div><h1>{{ t("auth.register_title") }}</h1><p>{{ t("auth.register_intro") if lang == "es" else "Discover the best events on campus." }}</p><form class="panel form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="name">{{ t("auth.name") }}</label><input id="name" name="name" maxlength="100" autocomplete="name" required><label for="email">{{ t("auth.email") }}</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">{{ t("auth.password_min") }}</label><input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required><label for="currency">{{ t("auth.preferred") }}</label><select id="currency" name="currency">{% for c in currencies %}<option value="{{ c }}" {% if c == 'USD' %}selected{% endif %}>{{ c }}</option>{% endfor %}</select><p class="note">{{ t("auth.preferred_note") }}</p><button class="btn btn-primary" type="submit">{{ t("auth.create") }}</button></form></div>{% endblock %}
